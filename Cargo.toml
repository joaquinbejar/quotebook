[workspace]
members = ["quotebook-core", "program", "sdk", "maker", "cli", "lint-control"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Joaquin Bejar <jb@taunais.com>"]
license = "MIT"
repository = "https://github.com/joaquinbejar/quotebook"

[workspace.dependencies]
# Versions checked on crates.io (max_stable_version) on 2026-10-29.
bytemuck = { version = "1.25", default-features = false, features = ["derive", "must_cast", "min_const_generics"] }
proptest = "1.12"
quotebook-core = { path = "quotebook-core", version = "0.1" }
thiserror = "2.0"
quotebook-sdk = { path = "sdk", version = "0.1" }
# Maker service (off-chain), checked on crates.io 2026-10-29.
market-maker-rs = "0.6"
rust_decimal = "1.43"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
solana-signature = { version = "3.5", features = ["verify"] }
# CLI and maker binary only, never core or the program. 4.4.0 is the latest stable but pulls
# the agave 4.4 crates LiteSVM 0.18.1 does not build with; 4.3 (4.3.2) is the newest that
# resolves with the LiteSVM pins (checked 2026-10-29).
solana-rpc-client = "4.3"
solana-commitment-config = "3.1"
solana-hash = "4.6"
# Pinocchio 0.11 generation: decided exception to the latest-stable rule (docs/PLAN.md).
pinocchio = { version = "0.11", default-features = false, features = ["cpi"] }
pinocchio-system = "0.6"
pinocchio-token = "0.7"
# LiteSVM 0.18.1 (latest) pins `solana-address ~2.7` and these generations of the Solana client
# crates, so the workspace uses them; approved exception to the latest-stable rule
# (docs/PLAN.md, Dependencies), as in optfix.
solana-address = { version = "2.7", default-features = false, features = ["bytemuck"] }
litesvm = "0.18"
solana-account = "4.7"
solana-clock = "3.2"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-sdk-ids = "3.1"
solana-signer = "3.0"
solana-transaction = "4.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
# Pinocchio's entrypoint macros test `target_os = "solana"`; `lint_control` is set only by
# `make lint-control`.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(lint_control)',
] }

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
float_arithmetic = "deny"
panic_in_result_fn = "deny"
manual_assert = "deny"
disallowed_macros = "deny"          # list in clippy.toml

[profile.release]
overflow-checks = true
codegen-units = 1
lto = "fat"
